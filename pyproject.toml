[project]
name = "pgl"
version = "1.0.0"
description = "A places conflation pipeline with stable ids, an MCP places server, and agent harnesses gated on production failure modes"
requires-python = ">=3.12"
dependencies = ["mcp>=2.0", "pydantic>=2.6", "numpy>=1.26", "scikit-learn>=1.4"]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
dev = ["pytest>=8", "ruff>=0.5", "pyspark>=3.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF005", "RUF046", "E731", "SIM102", "SIM105", "SIM108", "B007", "B023", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_world.py" = ["E501"]
"scripts/heldout.py" = ["E402"]
