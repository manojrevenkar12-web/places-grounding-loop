name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts && ruff format --check src tests scripts
      - name: The world is reproducible and the held-out pin holds
        run: python scripts/build_world.py && git diff --exit-code data && PYTHONPATH=src python -c "from pgl.heldout import check; check()"
      - name: Tests, including Spark and local blocking giving the same pairs
        run: pytest -q
      - name: Gate the candidate harness against the current one
        run: PYTHONPATH=src python scripts/gate.py
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit && npx eslint src test
      - run: npx vitest run
      - run: npm run build
